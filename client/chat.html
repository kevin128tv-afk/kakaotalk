<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 기본 뷰포트 설정 (확대 제한 없음) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채팅방</title>
  <style>
    /* [기본 스타일 - PC/기본 모드] */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      background-color: #f0f0f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    /* 헤더 스타일 */
    .chat-header {
      background-color: #fff;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }
    .header-title {
      font-weight: bold;
      font-size: 18px;
    }
    
    /* 모바일 모드 전환 버튼 스타일 */
    #toggleMobileBtn {
      padding: 6px 12px;
      background-color: #555;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    #toggleMobileBtn.active {
      background-color: #fee500;
      color: #000;
    }

    /* 채팅 메시지 영역 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background-color: #abc1d1; /* 카톡 색상 */
    }
    
    /* 메시지 말풍선 기본 (PC) */
    .message {
      max-width: 60%;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      position: relative;
      word-break: break-word;
    }
    .message.my {
      align-self: flex-end;
      background-color: #fee500;
    }
    .message.other {
      align-self: flex-start;
      background-color: #fff;
    }
    .message .sender {
      font-size: 11px;
      color: #777;
      margin-bottom: 3px;
    }

    /* 하단 입력창 영역 (PC) */
    .chat-input-container {
      background-color: #fff;
      padding: 15px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #ddd;
    }
    .chat-input-container input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px; /* 16px보다 작으므로 모바일에선 자동 확대됨 */
    }
    .chat-input-container button {
      padding: 0 20px;
      background-color: #fee500;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* =================================================== */
    /* [모바일 모드 스타일 - .mobile-mode 클래스가 body에 붙었을 때만 작동] */
    /* =================================================== */
    
    body.mobile-mode {
      height: 100dvh; /* 모바일 동적 뷰포트 높이 반영 */
    }

    /* 1. 입력창 자동 확대 방지 (폰트 16px 적용) */
    body.mobile-mode .chat-input-container input {
      font-size: 16px !important;
      padding: 12px;
      border-radius: 20px; /* 더 둥글게 */
    }
    
    /* 2. 모바일용 말풍선 스타일 조정 */
    body.mobile-mode .message {
      max-width: 80%; /* 화면을 더 꽉 채우게 */
      font-size: 15px; /* 글자 조금 더 크게 */
      border-radius: 12px;
    }
    
    /* 3. 입력창 영역 모바일 최적화 */
    body.mobile-mode .chat-input-container {
      padding: 10px;
      gap: 8px;
    }
    body.mobile-mode .chat-input-container button {
      border-radius: 20px;
      padding: 0 15px;
    }

  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  
  <div class="chat-header">
    <div class="header-title" id="headerTitle">채팅방</div>
    <!-- 모바일 모드 토글 버튼 -->
    <button id="toggleMobileBtn">모바일 모드 OFF</button>
  </div>

  <div class="chat-messages" id="messages">
    <!-- 메시지들이 여기에 추가됨 -->
  </div>

  <form class="chat-input-container" id="chatForm">
    <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." autocomplete="off" required>
    <button type="submit">전송</button>
  </form>

  <script>
    // --- 로그인 체크 및 이름 표시 ---
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) {
      window.location.href = '/login.html';
    } else {
      document.getElementById('headerTitle').innerText = `${user.name} 님의 채팅방`;
    }

    // --- 소켓 연결 ---
    const socket = io();
    const messagesDiv = document.getElementById('messages');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');

    socket.emit('join', user.name);

    // --- 메시지 전송 ---
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (text) {
        socket.emit('sendMessage', { sender: user.name, text });
        messageInput.value = '';
        messageInput.focus();
      }
    });

    // --- 메시지 수신 및 화면 표시 ---
    socket.on('message', (data) => {
      const msgDiv = document.createElement('div');
      const isMy = data.sender === user.name;
      msgDiv.classList.add('message', isMy ? 'my' : 'other');

      if (!isMy) {
        const senderDiv = document.createElement('div');
        senderDiv.classList.add('sender');
        senderDiv.innerText = data.sender;
        msgDiv.appendChild(senderDiv);
      }

      const textNode = document.createTextNode(data.text);
      msgDiv.appendChild(textNode);

      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight; // 자동 아래 스크롤
    });

    // --- [핵심 기능] 모바일 모드 토글 스크립트 ---
    const toggleBtn = document.getElementById('toggleMobileBtn');
    
    toggleBtn.addEventListener('click', () => {
      // body 태그에 'mobile-mode' 클래스를 넣었다 뺐다 함
      document.body.classList.toggle('mobile-mode');
      
      // 클래스가 있는지 확인해서 버튼 텍스트와 스타일 변경
      if (document.body.classList.contains('mobile-mode')) {
        toggleBtn.innerText = '모바일 모드 ON';
        toggleBtn.classList.add('active');
        alert('모바일 최적화 모드가 켜졌습니다. 입력창을 눌러도 확대되지 않습니다.');
      } else {
        toggleBtn.innerText = '모바일 모드 OFF';
        toggleBtn.classList.remove('active');
        alert('기본 모드로 돌아갑니다.');
      }
    });
  </script>
</body>
</html>
