<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>카카오톡 채팅방</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #abc1d1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background-color: #a0b9ce;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #92a8ba;
    }
    .header h2 { font-size: 16px; color: #333; }
    .header-btns { display: flex; gap: 6px; }
    .header-btns button {
      padding: 6px 10px;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    .header-btns .clear-btn {
      background-color: #ff4d4f;
      color: #fff;
      border: none;
    }
    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      position: relative;
    }
    .message-row.my-msg {
      align-self: flex-end;
      align-items: flex-end;
    }
    .message-row.other-msg {
      align-self: flex-start;
      align-items: flex-start;
    }
    .sender-name {
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
    }
    .bubble-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .my-msg .bubble-wrapper { flex-direction: row-reverse; }
    .bubble {
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .my-msg .bubble {
      background-color: #fee500;
      color: #000;
      border-top-right-radius: 2px;
    }
    .other-msg .bubble {
      background-color: #ffffff;
      color: #000;
      border-top-left-radius: 2px;
    }

    /* 노란색 숫자 1 및 시간 메타 정보 */
    .meta-info {
      display: flex;
      flex-direction: column;
      font-size: 10px;
      color: #666;
    }
    .my-msg .meta-info { align-items: flex-end; }
    .other-msg .meta-info { align-items: flex-start; }

    .unread-count {
      color: #e6b800;
      font-weight: bold;
      font-size: 11px;
      line-height: 1.2;
    }

    /* 점점점 메뉴 */
    .more-options {
      position: relative;
      display: inline-block;
    }
    .menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      color: #666;
      padding: 0 2px;
      line-height: 1;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      bottom: 100%;
      right: 0;
      background-color: #ffffff;
      min-width: 70px;
      box-shadow: 0px 2px 8px rgba(0,0,0,0.15);
      border-radius: 6px;
      z-index: 10;
      overflow: hidden;
    }
    .dropdown-content button {
      width: 100%;
      padding: 8px 10px;
      border: none;
      background: none;
      text-align: left;
      font-size: 12px;
      color: #ff4d4f;
      cursor: pointer;
    }
    .dropdown-content button:hover { background-color: #f5f5f5; }
    .show { display: block; }

    .input-area {
      background-color: #ffffff;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }
    .input-area button {
      padding: 10px 16px;
      background-color: #fee500;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="roomTitle">채팅방</h2>
    <div class="header-btns">
      <button class="clear-btn" onclick="clearAll()">기록 삭제</button>
      <button onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <form class="input-area" id="messageForm">
    <input type="text" id="msgInput" placeholder="메시지를 입력하세요..." autocomplete="off" required>
    <button type="submit">전송</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const userJson = localStorage.getItem('user');
    if (!userJson) {
      alert('로그인이 필요합니다!');
      window.location.href = '/login.html';
    }

    const user = JSON.parse(userJson || '{}');
    const username = user.name || '알 수 없는 사용자';
    document.getElementById('roomTitle').innerText = `${username} 님의 채팅방`;

    const socket = io();
    socket.emit('join', username);

    // 안 읽은 사람 수 계산 (채팅방 총 참여 인원 2명 기준)
    function getUnreadCount(msg) {
      const readBy = msg.readBy || [];
      const unread = 2 - readBy.length;
      return unread > 0 ? unread : '';
    }

    function renderMessage(data) {
      const chatBox = document.getElementById('chatBox');
      const isMine = data.sender === username;
      const unreadNum = getUnreadCount(data);

      const row = document.createElement('div');
      row.className = `message-row ${isMine ? 'my-msg' : 'other-msg'}`;
      row.id = `msg-${data.id}`;

      row.innerHTML = `
        ${!isMine ? `<div class="sender-name">${data.sender}</div>` : ''}
        <div class="bubble-wrapper">
          <div class="bubble">${data.text}</div>
          <div class="meta-info">
            <span class="unread-count" id="unread-${data.id}">${unreadNum}</span>
            <span class="time">${data.timestamp || ''}</span>
          </div>
          <div class="more-options">
            <button class="menu-btn" onclick="toggleMenu('${data.id}', event)">⋮</button>
            <div id="dropdown-${data.id}" class="dropdown-content">
              <button onclick="deleteSingle('${data.id}')">삭제</button>
            </div>
          </div>
        </div>
      `;

      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 서버 이력 초기 수신
    socket.on('initMessages', (msgList) => {
      document.getElementById('chatBox').innerHTML = '';
      msgList.forEach(m => renderMessage(m));
    });

    // 새 메시지 수신
    socket.on('message', (data) => {
      renderMessage(data);
    });

    // 상대방 접속 등으로 읽음 상태 업데이트 시
    socket.on('messagesReadStatusUpdated', (msgList) => {
      msgList.forEach(m => {
        const el = document.getElementById(`unread-${m.id}`);
        if (el) {
          el.innerText = getUnreadCount(m);
        }
      });
    });

    // 개별 삭제 수신
    socket.on('messageDeleted', (msgId) => {
      const el = document.getElementById(`msg-${msgId}`);
      if (el) el.remove();
    });

    // 전체 삭제 수신
    socket.on('allMessagesCleared', () => {
      document.getElementById('chatBox').innerHTML = '';
    });

    // 메시지 전송
    document.getElementById('messageForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();

      if (text) {
        socket.emit('sendMessage', { sender: username, text: text });
        input.value = '';
      }
    });

    // 점점점 메뉴 토글
    function toggleMenu(id, event) {
      event.stopPropagation();
      document.querySelectorAll('.dropdown-content').forEach(el => {
        if (el.id !== `dropdown-${id}`) el.classList.remove('show');
      });
      document.getElementById(`dropdown-${id}`).classList.toggle('show');
    }

    window.addEventListener('click', () => {
      document.querySelectorAll('.dropdown-content').forEach(el => el.classList.remove('show'));
    });

    function deleteSingle(msgId) {
      socket.emit('deleteSingleMessage', msgId);
    }

    function clearAll() {
      if (confirm('모든 메시지 기록을 삭제하시겠습니까?')) {
        socket.emit('clearAllMessages');
      }
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
